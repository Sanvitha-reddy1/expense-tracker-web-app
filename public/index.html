<!DOCTYPE html>

<html>
<head>
<title>Expense Tracker</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-body">

<h2 class="text-center mb-4">Expense Tracker Dashboard</h2>

<div class="row g-2 mb-3">

<div class="col-md-5">
<input id="title" class="form-control" placeholder="Expense name">
</div>

<div class="col-md-3">
<input id="amount" type="number" class="form-control" placeholder="Amount">
</div>

<div class="col-md-2 ms-3">
<button onclick="addExpense()" class="btn btn-primary w-100">Add</button>
</div>

</div>

<h5 class="mb-3">Total Spending: $<span id="total">0</span></h5>

<ul id="list" class="list-group mb-4"></ul>

<div class="card p-3 mt-3" id = "chartbox" style = "display:none"></div>
<canvas id="expenseChart"></canvas>
</div>

</div>
</div>

</div>

<script src="script.js"></script>

</body>
</html>
